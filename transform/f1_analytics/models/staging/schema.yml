version: 2

models:
  - name: stg_sessions
    description: "Cleaned F1 sessions from OpenF1 API, only completed sessions"
    columns:
      - name: session_key
        description: "Unique session identifier"
        tests:
          - not_null
          - unique

  - name: stg_drivers
    description: "F1 drivers per session, 2026 season"
    columns:
      - name: driver_number
        description: "Driver race number"
        tests:
          - not_null

  - name: stg_laps
    description: "Lap times per driver and session, nulls removed"
    columns:
      - name: lap_duration
        description: "Total lap time in seconds"
        tests:
          - not_null